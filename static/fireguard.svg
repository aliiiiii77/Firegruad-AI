
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff5a5a"/>
      <stop offset="100%" stop-color="#6b0000"/>
    </radialGradient>

    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>

    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54A"/>
      <stop offset="50%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#D10000"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#ff4040" stroke-width="8"/>

  <!-- Shield -->
  <path d="M256 80
           L380 130
           V240
           C380 330 325 395 256 440
           C187 395 132 330 132 240
           V130 Z"
        fill="url(#shield)"
        stroke="#ffffff"
        stroke-width="8"/>

  <!-- Flame -->
  <path d="M256 150
           C230 180 220 205 232 230
           C205 220 185 245 185 275
           C185 325 220 360 256 370
           C292 360 327 325 327 275
           C327 240 300 220 282 195
           C285 225 265 235 256 245
           C248 230 248 195 256 150 Z"
        fill="url(#flame)"
        filter="url(#glow)"/>

  <!-- AI Circuit -->
  <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.85">
    <circle cx="256" cy="235" r="10" fill="#ffffff"/>
    <path d="M256 225 V185"/>
    <path d="M246 242 L215 260"/>
    <path d="M266 242 L297 260"/>
    <circle cx="256" cy="175" r="5" fill="#ffffff"/>
    <circle cx="205" cy="265" r="5" fill="#ffffff"/>
    <circle cx="307" cy="265" r="5" fill="#ffffff"/>
  </g>

  <!-- Text -->
  <text x="256" y="470"
        font-family="Poppins, Arial"
        font-size="34"
        font-weight="700"
        fill="#ffffff"
        text-anchor="middle">
    FIREGUARD AI
  </text>
</svg>